<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>afiche2027</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root { --verde:#12a05c; --ambar:#e08a00; --azul:#2f7bd6; --gris:#8a97a6; }
  body { font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:#0f1720; color:#eef3f8; padding:12px 10px 40px; }
  header { text-align:center; margin-bottom:12px; }
  header h1 { font-size:26px; font-weight:800; letter-spacing:.02em; }
  header p { color:#8fa0b4; font-size:13px; margin-top:3px; }
  .barra { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:12px 0; }
  .chip { border:1px solid #26313d; background:#18222d; color:#cfe0f0; padding:8px 14px; border-radius:999px;
          font-size:13px; font-weight:700; cursor:pointer; }
  .chip.on { background:#2f7bd6; border-color:#2f7bd6; color:#fff; }
  .cont { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; max-width:900px; margin:0 auto; }
  .celda { background:#18222d; border:2px solid #26313d; border-radius:12px; padding:6px; text-align:center;
           cursor:pointer; overflow:hidden; }
  .celda .num { font-size:20px; font-weight:800; }
  .celda .info { font-size:10px; color:#9fb0c3; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .celda .saldo { font-size:10px; margin-top:3px; font-weight:700; }
  .celda.libre { border-color:#1d5c3f; }
  .celda.libre .num { color:var(--verde); }
  .celda.apartado { border-color:#6b4c14; }
  .celda.apartado .num { color:var(--ambar); }
  .celda.pagado { border-color:#24558c; }
  .celda.pagado .num { color:var(--azul); }
  .leyenda { max-width:900px; margin:18px auto 0; font-size:12px; color:#8fa0b4; text-align:center; line-height:1.7; }
  .leyenda b { color:#cfe0f0; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); display:none; align-items:center; justify-content:center; padding:14px; z-index:9; }
  .overlay.on { display:flex; }
  .modal { background:#18222d; border:1px solid #2b3947; border-radius:16px; width:100%; max-width:400px; max-height:92vh; overflow:auto; padding:18px; }
  .modal h2 { font-size:34px; font-weight:800; text-align:center; }
  .modal .estado { text-align:center; font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px; }
  .modal .info { color:#cfe0f0; font-size:15px; text-align:center; }
  .resumen { display:flex; gap:8px; margin:14px 0; }
  .resumen > div { flex:1; background:#0f1720; border:1px solid #2b3947; border-radius:10px; padding:10px 6px; text-align:center; }
  .resumen .n { font-size:16px; font-weight:800; }
  .resumen .l { font-size:9px; color:#8fa0b4; text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  label { display:block; font-size:12px; font-weight:700; color:#9fb0c3; margin:10px 0 4px; }
  input { width:100%; padding:11px; border-radius:10px; border:1px solid #2b3947; background:#0f1720; color:#eef3f8; font-size:15px; }
  .btn { width:100%; padding:13px; border-radius:12px; border:0; background:var(--verde); color:#fff; font-size:16px; font-weight:800; margin-top:14px; cursor:pointer; }
  .btn.sec { background:#26313d; }
  .btn.azul { background:var(--azul); }
  .btn.ambar { background:var(--ambar); }
  .msj { text-align:center; font-size:13px; margin-top:10px; min-height:18px; }
  .msj.ok { color:#3ddc84; } .msj.mal { color:#ff6b6b; }
  .codigo { font-size:22px; font-weight:800; letter-spacing:.12em; text-align:center; background:#0f1720;
            border:1px dashed #2b3947; border-radius:10px; padding:12px; margin:10px 0; }
  .nota { font-size:11px; color:#8fa0b4; text-align:center; margin-top:6px; line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1>afiche2027</h1>
  <p>83 puestos publicitarios - valor 55.000 cada uno</p>
</header>

<div class="barra">
  <div class="chip on" data-f="todos">Todos</div>
  <div class="chip" data-f="libre">Libres <span id="cLibre"></span></div>
  <div class="chip" data-f="apartado">Con abono</div>
  <div class="chip" data-f="pagado">Pagados</div>
  <div class="chip" data-f="mio">Mi codigo</div>
</div>

<div class="cont" id="cont"></div>

<div class="leyenda">
  <b>Verde</b> libre &nbsp;·&nbsp; <b>Naranja</b> con abono, falta completar &nbsp;·&nbsp; <b>Azul</b> pagado<br>
  Apartar un puesto abona dinero. Con el codigo puedes seguir abonado despues.
</div>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>

<script>
var $ = function (id) { return document.getElementById(id) }
var puestos = {}
var resumen = {}
var filtro = 'todos'

function api(p, opt) { return fetch(p, opt).then(function (r) { return r.json() }) }
function money(n) {
  n = Number(n || 0)
  var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.')
  return '$' + s
}

// Sube el logo SIEMPRE despues de registrar el abono. Si el archivo falla, el
// dinero ya quedo guardado: nunca se pierde un abono por un logo.
function subeLogo(codigo, arch) {
  if (!arch) return Promise.resolve({ ok: true, sinArchivo: true })
  if (arch.size > 4 * 1024 * 1024) return Promise.resolve({ ok: false, error: 'El archivo pesa mas de 4 MB' })
  return new Promise(function (res) {
    var rd = new FileReader()
    rd.onerror = function () { res({ ok: false, error: 'No se pudo leer el archivo' }) }
    rd.onload = function () {
      api('/api/afiche/mio/logo', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo: codigo, logo: rd.result }) })
        .then(res, function () { res({ ok: false, error: 'No se pudo subir el archivo, intenta de nuevo' }) })
    }
    rd.readAsDataURL(arch)
  })
}

function logTxt(lg) {
  if (!lg || lg.sinArchivo) return ''
  return lg.ok ? 'Logo recibido: ' + lg.tipo : (lg.error || 'No se pudo subir el logo')
}

function carga() {
  return api('/api/afiche/estado').then(function (d) {
    puestos = d.puestos
    resumen = d.resumen
    var libres = 0
    for (var k in puestos) if (puestos[k].estado === 'libre') libres++
    $('cLibre').textContent = '(' + libres + ')'
    pinta()
  })
}

function pinta() {
  var c = $('cont')
  c.innerHTML = ''
  for (var i = 1; i <= 83; i++) {
    var r = puestos[i] || { estado: 'libre', pagado: 0, saldo: resumen.topePorPuesto || 55000 }
    if (filtro !== 'todos' && r.estado !== filtro) continue
    var d = document.createElement('div')
    d.className = 'celda ' + r.estado
    var html = '<div class="num">' + i + '</div>'
    if (r.estado === 'libre') {
      html += '<div class="info">disponible</div>'
    } else {
      html += '<div class="info">' + (r.nombre || 'sin nombre') + '</div>'
      html += '<div class="saldo" style="color:' + (r.estado === 'pagado' ? '#5aa9ff' : '#ffb020') + '">'
        + (r.estado === 'pagado' ? 'completo' : 'falta ' + money(r.saldo)) + '</div>'
    }
    d.innerHTML = html
    d.setAttribute('data-n', i)
    d.onclick = function () { abre(this.getAttribute('data-n')) }
    c.appendChild(d)
  }
}

function cajaSaldo(p, et) {
  return '<div class="resumen">'
    + '<div><div class="n" style="color:var(--verde)">' + money(p.pagado) + '</div><div class="l">abonado</div></div>'
    + '<div><div class="n" style="color:' + (et === 'pagado' ? '#5aa9ff' : '#ffb020') + '">'
    + (et === 'pagado' ? 'completo' : money(p.saldo)) + '</div><div class="l">'
    + (et === 'pagado' ? 'puesto pagado' : 'falta') + '</div></div>'
    + '</div>'
}

function abre(n) {
  var r = puestos[n] || { estado: 'libre', pagado: 0, saldo: 55000 }
  var et = r.estado
  var etTxt = et === 'libre' ? 'DISPONIBLE' : (et === 'apartado' ? 'CON ABONO' : 'PAGADO')
  var etCol = et === 'libre' ? 'var(--verde)' : (et === 'apartado' ? 'var(--ambar)' : 'var(--azul)')
  var h = '<h2>' + n + '</h2><div class="estado" style="color:' + etCol + '">' + etTxt + '</div>'

  if (et === 'libre') {
    h += '<label>Tu nombre</label><input id="fNombre" placeholder="Nombre y apellido">'
    h += '<label>Tu numero de telefono</label><input id="fTel" placeholder="Solo digitos" inputmode="numeric" pattern="[0-9]*" maxlength="20" oninput="this.value=this.value.replace(/\\D+/g,\'\')">'
    h += '<label>Cuanto abonas ahora (opcional)</label><input id="fAbono" placeholder="Ej: 20000" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/\\D+/g,\'\')">'
    h += '<label>Logo del puesto (opcional)</label><input type="file" id="fLogo" accept="image/*,.pdf,.svg">'
    h += '<div class="nota">JPG, PNG, PDF o captura. Si no lo tienes a la mano, subelo despues con tu codigo.</div>'
    h += '<div class="nota">Puedes apartar sin abonar ahora y pagar despues con tu codigo.</div>'
    h += '<button class="btn" id="bApartar">Apartar el ' + n + '</button>'
    h += '<div class="msj" id="m"></div>'
  } else {
    h += '<div class="info" style="color:#cfe0f0;font-size:15px;text-align:center">' + (r.nombre || '') + '</div>'
    h += cajaSaldo(r, et)
    h += '<div class="nota">Este puesto ya tiene due&ntilde;o.</div>'
    h += '<button class="btn sec" id="bCerrar">Cerrar</button>'
  }
  $('modal').innerHTML = h
  $('ov').classList.add('on')

  var bC = $('bCerrar')
  if (bC) bC.onclick = cierra

  var bA = $('bApartar')
  if (bA) {
    bA.onclick = function () {
      var nom = $('fNombre').value.trim()
      if (!nom) { msg('Escribe tu nombre', 'mal'); return }
      var tel = $('fTel').value.trim()
      if (!tel) { msg('Escribe tu numero de telefono', 'mal'); return }
      var ab = $('fAbono').value.trim()
      bA.disabled = true
      api('/api/afiche/apartar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ puesto: n, nombre: nom, tel: tel, abono: ab || 0 }) })
        .then(function (d) {
          if (!d.ok) { msg(d.error || 'No se pudo', 'mal'); bA.disabled = false; return }
          msg('Guardando...', '')
          subeLogo(d.codigo, $('fLogo').files[0]).then(function (lg) {
            exitoApartar(n, d.codigo, d.pagado, d.saldo, lg)
          })
        })
    }
  }
}

function msg(t, c) { var m = $('m'); if (m) { m.textContent = t; m.className = 'msj ' + c } }

function exitoApartar(n, c, pagado, saldo, lg) {
  var et = pagado >= (resumen.topePorPuesto || 55000) ? 'pagado' : 'apartado'
  var etCol = et === 'pagado' ? 'var(--azul)' : 'var(--ambar)'
  var etTxt = et === 'pagado' ? 'PAGADO' : 'APARTADO'
  $('modal').innerHTML = '<h2>' + n + '</h2><div class="estado" style="color:' + etCol + '">' + etTxt + '</div>'
    + '<div style="text-align:center;font-size:14px;line-height:1.6">Guarda tu codigo para abonar el resto:</div>'
    + '<div class="codigo">' + c + '</div>'
    + cajaSaldo({ pagado: pagado, saldo: saldo }, et)
    + (lg && !lg.sinArchivo
        ? '<div class="msj ' + (lg.ok ? 'ok' : 'mal') + '">' + logTxt(lg) + '</div>'
        : '')
    + '<div class="nota">Envia el codigo al administrador para que registre tus abonos.</div>'
    + '<button class="btn" id="bListo">Listo</button>'
  $('bListo').onclick = function () { cierra(); carga() }
}

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }

function pideCodigo(err) {
  $('modal').innerHTML = '<h2 style="font-size:22px">Mi codigo</h2>'
    + '<div style="text-align:center;font-size:13px;color:#8fa0b4;margin-bottom:10px">Escribe el codigo de 6 letras que te dimos</div>'
    + '<input id="cCod" placeholder="Ej: K7P2QB" style="text-transform:uppercase;text-align:center;font-size:20px;letter-spacing:.1em">'
    + '<button class="btn azul" id="bBuscar">Buscar</button><div class="msj" id="m"></div>'
  $('ov').classList.add('on')
  if (err) msg(err, 'mal')
  $('bBuscar').onclick = function () {
    var c = $('cCod').value.trim().toUpperCase()
    if (!c) return
    muestraMi(c)
  }
}

function muestraMi(c, aviso) {
  api('/api/afiche/mio', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ codigo: c }) })
    .then(function (d) {
      if (!d.ok) { pideCodigo(d.error || 'Codigo no encontrado'); return }
      pintaMi(c, d.r, aviso)
    }, function () { pideCodigo('No se pudo conectar, intenta de nuevo') })
}

// El logo que el dueno o la vendedora ven con su codigo.
function logoActual(r) {
  if (!r.logoEstado || r.logoEstado === 'sin-logo') return ''
  var vis = ''
  if (r.logo) {
    vis = r.logoTipo.indexOf('PDF') === 0
      ? '<iframe src="' + r.logo + '" style="width:100%;height:130px;border:0;border-radius:10px;background:#fff"></iframe>'
      : '<img src="' + r.logo + '" style="max-width:100%;max-height:130px;border-radius:10px">'
  }
  var t = r.logoEstado === 'aprobado' ? 'Tu logo ya quedo aprobado.'
    : (r.logoEstado === 'rechazado' ? 'El logo fue rechazado: hay que subirlo de nuevo.'
    : (r.logoEstado === 'recibido' ? 'Logo recibido, falta que lo revisen.' : ''))
  return '<div class="nota" style="margin-top:14px">Tu logo:</div>'
    + (vis ? '<div style="text-align:center;margin-top:6px">' + vis + '</div>' : '')
    + (t ? '<div class="nota">' + t + '</div>' : '')
    + (r.logoNota ? '<div class="nota" style="color:#ff9a9a">' + esc(r.logoNota) + '</div>' : '')
}

function pintaMi(c, r, aviso) {
  var et = r.estado
  var etCol = et === 'pagado' ? 'var(--azul)' : (et === 'apartado' ? 'var(--ambar)' : 'var(--verde)')
  var etTxt = et === 'pagado' ? 'PAGADO' : (et === 'apartado' ? 'CON ABONO' : 'DISPONIBLE')
  var h = '<h2>' + r.puesto + '</h2><div class="estado" style="color:' + etCol + '">' + etTxt + '</div>'
  h += '<div class="info" style="color:#cfe0f0;font-size:15px;text-align:center">' + esc(r.nombre || '') + '</div>'
  h += cajaSaldo(r, et)
  h += logoActual(r)
  if (et !== 'pagado') {
    h += '<label>Cuanto vas a abonar</label><input id="aMonto" placeholder="Ej: 20000" inputmode="numeric" pattern="[0-9]*" oninput="this.value=this.value.replace(/\\D+/g,\'\')">'
  }
  h += '<label>Logo del puesto</label><input type="file" id="fLogo" accept="image/*,.pdf,.svg">'
  h += '<div class="nota">JPG, PNG, PDF o captura. Puedes subirlo hoy o despues, siempre con tu codigo.</div>'
  h += '<button class="btn ambar" id="bAbonar">' + (et === 'pagado' ? 'Subir logo' : 'Registrar abono y logo') + '</button>'
  h += '<div class="msj" id="m"></div>'
  h += '<button class="btn sec" id="bCerrar">Cerrar</button>'
  $('modal').innerHTML = h
  $('ov').classList.add('on')
  $('bCerrar').onclick = cierra
  if (aviso && aviso.t) msg(aviso.t, aviso.ok ? 'ok' : 'mal')

  $('bAbonar').onclick = function () {
    var m = $('aMonto') ? $('aMonto').value.trim() : ''
    var arch = $('fLogo').files[0]
    if (!m && !arch) { msg('Escribe el monto o elige tu logo', 'mal'); return }
    var btn = $('bAbonar')
    btn.disabled = true
    msg('Guardando...', '')
    // Primero el dinero, despues el archivo: un fallo del logo nunca deja el
    // abono sin registrar.
    var paso1 = m
      ? api('/api/afiche/mio/abonar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codigo: c, monto: m }) })
      : Promise.resolve({ ok: true, estado: r.estado, saldo: r.saldo })
    paso1.then(function (x) {
      if (!x.ok) { msg(x.error || 'No se pudo registrar el abono', 'mal'); btn.disabled = false; return }
      subeLogo(c, arch).then(function (lg) {
        var t = []
        var bien = true
        if (m) t.push('Abono registrado. Quedan ' + money(x.saldo))
        if (lg && !lg.sinArchivo) {
          if (lg.ok) t.push('Logo recibido: ' + lg.tipo)
          else { t.push(lg.error || 'No se pudo subir el logo'); bien = false }
        }
        muestraMi(c, { t: t.join('  ·  '), ok: bien })
      })
    })
  }
}

function cierra() { $('ov').classList.remove('on') }
$('ov').onclick = function (e) { if (e.target === $('ov')) cierra() }

Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (c) {
  c.onclick = function () {
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (x) { x.classList.remove('on') })
    c.classList.add('on')
    filtro = c.getAttribute('data-f')
    if (filtro === 'mio') { pideCodigo(); filtro = 'todos' } else pinta()
  }
})

carga()
setInterval(carga, 5000)
</script>
</body>
</html>
